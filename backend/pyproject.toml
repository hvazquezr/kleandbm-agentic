[project]
name = "kleandbm-backend"
version = "0.1.0"
description = "Multi-agent analytical data model design: API and core"
requires-python = ">=3.15"
# Direct runtime dependencies, with ranges that allow compatible updates. The exact versions
# installed (with hashes) are pinned in pylock.toml; see "Dependencies" in CLAUDE.md for how to
# update them. The MySQL MCP server (mcp/mysql_source) runs in the same environment, so its
# dependencies (mcp, pymysql) are listed here too.
dependencies = [
    # API and persistence
    "fastapi>=0.162,<0.163",
    "uvicorn>=0.54,<0.55",
    "python-multipart>=0.0.33,<0.1",
    "sse-starlette>=3.7,<4",
    "sqlalchemy>=2.1,<2.2",
    "psycopg[binary,pool]>=3.3,<3.4",
    "alembic>=1.20,<2",
    "pgvector>=0.5,<0.6",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pyjwt[crypto]>=2.15,<3",
    "httpx>=0.28,<0.29",
    "cryptography>=50,<51",
    "boto3>=1.44,<2",
    # Agents and model providers
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-postgres>=3.2,<3.3",
    "langsmith>=0.14.17,<0.15",
    "anthropic>=2.8,<3",
    "openai>=3.48,<4",
    # Sources (MCP server and client)
    "mcp>=2.3,<3",
    "pymysql>=1.2,<2",
    "anyio>=4.16,<5",
    # Document extraction
    "pypdf>=7,<8",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1,<4",
    "pillow>=13,<14",
]

[project.optional-dependencies]
dev = ["pytest>=9.2,<10"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live provider tests cost money; run them explicitly with: pytest -m live_llm
addopts = "-m 'not live_llm'"
markers = [
    "live_llm: calls a real model provider (opt-in, not run by default)",
]
