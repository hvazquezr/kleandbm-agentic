[project]
name = "kleandbm-backend"
version = "0.1.0"
description = "Multi-agent analytical data model design: API and core"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.3",
    "alembic>=1.20",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyjwt[crypto]>=2.15",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=9.2"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_llm: calls a real model provider (opt-in, not run by default)",
]
