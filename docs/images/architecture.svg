<text x='380' y='426' text-anchor='middle' font-size='11.5' fill='#5B6577'>curated read-only tools</text>
<text x='380' y='442' text-anchor='middle' font-size='11.5' fill='#5B6577'>personal data masked</text>
<rect x='546' y='386' width='190' height='72' rx='8' fill='#FFFFFF' stroke='#8A94A6' stroke-width='1.25'/>
<text x='641' y='410' text-anchor='middle' font-weight='600' fill='#1B2433'>Transcript monitor</text>
<text x='641' y='426' text-anchor='middle' font-size='11.5' fill='#5B6577'>scores runs, never blocks</text>
<text x='641' y='442' text-anchor='middle' font-size='11.5' fill='#5B6577'>another model family</text>
