<text x='119' y='296' text-anchor='middle' font-size='11.5' fill='#5B6577'>requirements, definitions</text>
<text x='119' y='312' text-anchor='middle' font-size='11.5' fill='#5B6577'>questions</text>
<rect x='285' y='240' width='190' height='88' rx='8' fill='#FFFFFF' stroke='#8A94A6' stroke-width='1.25'/>
<text x='380' y='264' text-anchor='middle' font-weight='600' fill='#1B2433'>Architect (supervisor)</text>
<text x='380' y='280' text-anchor='middle' font-size='11.5' fill='#5B6577'>ReAct + selective ToT</text>
<text x='380' y='296' text-anchor='middle' font-size='11.5' fill='#5B6577'>edits a design candidate</text>
<text x='380' y='312' text-anchor='middle' font-size='11.5' fill='#5B6577'>decisions, feasibility</text>
<rect x='546' y='240' width='190' height='88' rx='8' fill='#FFFFFF' stroke='#8A94A6' stroke-width='1.25'/>
<text x='641' y='264' text-anchor='middle' font-weight='600' fill='#1B2433'>Validator</text>
<text x='641' y='280' text-anchor='middle' font-size='11.5' fill='#5B6577'>gpt-6-astra, read-only</text>
<text x='641' y='296' text-anchor='middle' font-size='11.5' fill='#5B6577'>findings, claim review</text>
<text x='641' y='312' text-anchor='middle' font-size='11.5' fill='#5B6577'>reads docs and sources</text>
