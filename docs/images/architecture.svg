<text x='380' y='164' text-anchor='middle' font-size='11.5' fill='#5B6577'>Haiku 5.5, one call</text>
<text x='380' y='178' text-anchor='middle' font-size='11.5' fill='#5B6577'>picks one or both agents</text>
<rect x='24' y='240' width='190' height='88' rx='8' fill='#FFFFFF' stroke='#8A94A6' stroke-width='1.25'/>
<text x='119' y='264' text-anchor='middle' font-weight='600' fill='#1B2433'>Business Requirements</text>
